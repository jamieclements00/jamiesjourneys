<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thanks — Jamie's Journeys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#111210;--text:#f0ede8;--text-muted:#555;--accent:#7aab8e;--border:#252522;--nav-h:56px;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;}
  nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 32px;z-index:100;border-bottom:1px solid var(--border);background:var(--bg);}
  .nav-back{font-size:0.74rem;font-weight:500;letter-spacing:0.09em;text-transform:uppercase;color:var(--text-muted);text-decoration:none;display:flex;align-items:center;gap:8px;transition:color 0.2s;}
  .nav-back:hover{color:var(--text);}
  .nav-logo{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:400;color:var(--text);text-decoration:none;}
  .nav-spacer{width:80px;}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:calc(var(--nav-h) + 48px) 32px 80px;}
  .thanks-inner{max-width:480px;text-align:center;}
  .thanks-eyebrow{font-size:0.7rem;font-weight:500;letter-spacing:0.13em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;}
  .thanks-title{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,3rem);font-weight:400;color:var(--text);line-height:1.15;margin-bottom:20px;}
  .thanks-rule{width:36px;height:1px;background:var(--accent);margin:0 auto 24px;}
  .thanks-text{font-size:1rem;line-height:1.8;font-weight:300;color:var(--text-muted);}
  .thanks-link{display:inline-flex;align-items:center;gap:8px;margin-top:40px;font-size:0.74rem;font-weight:500;letter-spacing:0.09em;text-transform:uppercase;color:var(--text-muted);text-decoration:none;transition:color 0.2s;}
  .thanks-link:hover{color:var(--text);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .thanks-inner{animation:fadeUp 0.5s ease both;}
</style>
</head>
<body>
<nav>
  <a class="nav-back" href="index.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </a>
  <a class="nav-logo" href="index.html">Jamie's Journeys</a>
  <div class="nav-spacer"></div>
</nav>
<main>
  <div class="thanks-inner">
    <div class="thanks-eyebrow">Message received</div>
    <h1 class="thanks-title">Thanks for getting in touch.</h1>
    <div class="thanks-rule"></div>
    <p class="thanks-text">I'll get back to you when I surface from whatever corner of the world I'm currently in.</p>
    <a class="thanks-link" href="index.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back to the blog
    </a>
  </div>
</main>
</body>
</html>
